<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>屏幕检测</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            cursor: pointer;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        }
        
        #color-screen {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            transition: background-color 0.2s;
        }

        /* Logo 启动页容器 */
        #logo-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF; /* 初始白色背景 */
            pointer-events: none;      /* 允许点击穿透触发全屏 */
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        
        #my-logo {
            max-width: 280px; /* 适配 Logo 尺寸 */
            height: auto;
            margin-bottom: 30px;
        }

        /* 主提示文字 */
        .start-hint {
            color: #333333;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 50px;
        }

        /* 署名样式 - 已修复大小写问题 */
        .footer-author {
            position: absolute;
            bottom: 40px;
            color: #999999;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: none; /* 确保不强制大写 */
        }

        kbd {
            background: #f8f8f8; color: #222;
            padding: 3px 8px; border-radius: 5px;
            border: 1px solid #ddd;
            margin: 0 4px;
            font-family: Arial, sans-serif;
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
        }

        /* 进入全屏后隐藏的类 */
        .hide-overlay {
            display: none !important;
        }
    </style>
</head>

    <div id="color-screen">
        <div id="info-overlay" style="display: none; color: rgba(255,255,255,0.3);">

        </div>
    </div>

    <script>
        const colors = [
            { hex: '#FF0000' }, // 红
            { hex: '#00FF00' }, // 绿
            { hex: '#0000FF' }, // 蓝
            { hex: '#FFFF00' }, // 黄
            { hex: '#000000' }, // 黑
            { hex: '#FFFFFF' }, // 白
            { hex: '#808080' }  // 灰
        ];

        let currentIndex = -1;
        const screen = document.getElementById('color-screen');
        const logoContainer = document.getElementById('logo-container');

        function handleClick() {
            // 触发全屏
            enterFullScreen();

            // 切换颜色逻辑
            currentIndex++;
            if (currentIndex >= colors.length) {
                currentIndex = 0; 
            }

            screen.style.backgroundColor = colors[currentIndex].hex;
            document.body.style.cursor = 'none';
        }

        function enterFullScreen() {
            const docElm = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen();
                } else if (docElm.webkitRequestFullScreen) {
                    docElm.webkitRequestFullScreen();
                }
            }
        }

        // 监听全屏状态变化
        function handleFullscreenChange() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            
            if (isFull) {
                // 进入全屏：隐藏 Logo 页面
                logoContainer.classList.add('hide-overlay');
            } else {
                // 退出全屏：恢复 Logo 页面和初始状态
                logoContainer.classList.remove('hide-overlay');
                currentIndex = -1;
                screen.style.backgroundColor = '#000000';
                document.body.style.cursor = 'default';
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        // 鼠标自动隐藏
        let timer;
        document.addEventListener('mousemove', () => {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFull) {
                document.body.style.cursor = 'default';
                clearTimeout(timer);
                timer = setTimeout(() => {
                    if(currentIndex !== -1) document.body.style.cursor = 'none';
                }, 1500);
            }
        });
    </script>
