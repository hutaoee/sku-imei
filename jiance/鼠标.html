<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鼠标全功能检测</title>
    <style>
        :root {
            --zz-red: #FF483C;
            --zz-green: #3CB371;
            --upper-bg: #E8EAED;
            --lower-bg: #FFFFFF;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--upper-bg);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            user-select: none;
            cursor: crosshair;
        }

        #tester-ui { width: 100%; height: 100%; display: flex; flex-direction: column; }

        .upper-section {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        @keyframes bigTextPop {
            0% { transform: scale(0.7); opacity: 0; }
            45% { transform: scale(1.2); opacity: 1; text-shadow: 0 0 25px rgba(60, 179, 113, 0.7); }
            100% { transform: scale(1); opacity: 1; }
        }

        .text-pop {
            animation: bigTextPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #mouse-info { 
            margin-bottom: 5px; color: var(--zz-green); 
            font-size: 64px; font-weight: 900; height: 90px;
            display: flex; align-items: center; justify-content: center;
            letter-spacing: 2px;
        }

        #coords-display {
            margin-bottom: 30px;
            font-family: "Courier New", Courier, monospace;
            font-size: 20px; font-weight: bold; color: #666;
            background: rgba(0,0,0,0.05); padding: 5px 20px;
            border-radius: 20px; border: 1px solid #CCC;
        }
        .coord-label { color: var(--zz-red); margin-right: 5px; }

        .main-test-area { display: flex; align-items: center; gap: 70px; }

        .mouse-visual {
            width: 180px; height: 280px; background: #D1D5DB;
            border-radius: 70px 70px 90px 90px;
            border: 4px solid #999; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .m-key { 
            position: absolute; top: 0; width: 86px; height: 125px; 
            background: #FFF; border-bottom: 2px solid #BBB;
        }
        #m-left { left: 0; border-radius: 66px 0 0 0; border-right: 1px solid #DDD; }
        #m-right { right: 0; border-radius: 0 66px 0 0; border-left: 1px solid #DDD; }
        
        #m-wheel {
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 65px; background: #444; border-radius: 15px;
            z-index: 10; border: 3px solid #333;
        }

        .side-keys { position: absolute; left: -15px; top: 105px; display: flex; flex-direction: column; gap: 12px; }
        .s-key {
            width: 15px; height: 55px; background: #FFF; border-radius: 10px 0 0 10px;
            border: 2px solid #999; border-right: none;
        }

        .passed-green { background-color: var(--zz-green) !important; }
        .active-press { background-color: var(--zz-red) !important; transform: scale(0.94); }

        .energy-track {
            width: 44px; height: 240px; background: #BBB; border-radius: 22px;
            padding: 5px; box-sizing: border-box; border: 3px solid #999;
            position: relative; display: flex; flex-direction: column; justify-content: flex-end;
        }
        #energy-bar {
            width: 100%; height: 50%; background-color: var(--zz-green);
            border-radius: 17px; transition: height 0.1s ease-out;
        }
        #energy-bar.scrolling-red { 
            background-color: var(--zz-red) !important; 
            box-shadow: 0 0 20px var(--zz-red);
            transform: scaleX(1.15);
        }

        .full-divider { width: 100%; height: 8px; background: var(--zz-red); }
        .lower-section {
            height: 160px; background: var(--lower-bg);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; position: relative;
        }
        #zz-logo { max-height: 75px; width: auto; margin-top: -20px; }
        .footer-id { position: absolute; bottom: 15px; color: #999; font-size: 15px; font-weight: 600; }
        .status-legend { margin-top: 20px; font-weight: bold; color: #555; font-size: 18px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="tester-ui">
        <div class="upper-section">
            <div id="mouse-info">等待检测</div>
            
            <div id="coords-display">
                <span class="coord-label">X:</span><span id="coord-x">0</span>
                <span style="margin: 0 15px; color: #CCC;">|</span>
                <span class="coord-label">Y:</span><span id="coord-y">0</span>
            </div>
            
            <div class="main-test-area">
                <div class="mouse-visual">
                    <div class="side-keys">
                        <div id="m-side-forward" class="s-key"></div> 
                        <div id="m-side-back" class="s-key"></div>
                    </div>
                    <div id="m-left" class="m-key"></div>
                    <div id="m-wheel" class="m-wheel"></div>
                    <div id="m-right" class="m-key"></div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <div class="energy-track">
                        <div id="energy-bar"></div>
                    </div>
                    <b style="color:#444">滚轮状态</b>
                </div>
            </div>

            <div class="status-legend">
                <span style="color:var(--zz-green)">● 绿色</span> 功能正常 | 
                <span style="color:var(--zz-red)">● 红色</span> 正在触发
            </div>
        </div>

        <div class="full-divider"></div>

        <div class="lower-section">
            <div class="logo-area">
                <img id="zz-logo" src="data:image/png;base64," alt="Logo">
            </div>
            <div class="footer-id">By：MengLingTong ID 13870</div>
        </div>
    </div>

    <script>
        const info = document.getElementById('mouse-info');
        const energyBar = document.getElementById('energy-bar');
        const coordX = document.getElementById('coord-x');
        const coordY = document.getElementById('coord-y');
        let energyLevel = 50;
        let scrollTimer = null;

        window.addEventListener('mousemove', (e) => {
            coordX.innerText = e.clientX;
            coordY.innerText = e.clientY;
        });

        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
               (e.ctrlKey && e.keyCode === 85)) {
                return false;
            }
        };

        function showPopText(msg) {
            info.innerText = msg;
            info.classList.remove('text-pop');
            void info.offsetWidth; 
            info.classList.add('text-pop');
        }

        // 核心修改：使用捕获模式并拦截默认行为
        window.addEventListener('mousedown', (e) => {
            // 拦截侧键默认行为
            if (e.button === 3 || e.button === 4) {
                e.preventDefault();
                e.stopPropagation();
            }

            let id = "";
            let name = "";
            switch(e.button) {
                case 0: id = 'm-left'; name = "左键 OK"; break;
                case 1: id = 'm-wheel'; name = "中键 OK"; break;
                case 2: id = 'm-right'; name = "右键 OK"; break;
                case 3: id = 'm-side-back'; name = "后退键 OK"; break;
                case 4: id = 'm-side-forward'; name = "前进键 OK"; break;
            }
            if (id) {
                const el = document.getElementById(id);
                el.classList.add('active-press');
                el.classList.add('passed-green');
                showPopText(name);
            }
        }, true); // 使用捕获模式

        window.addEventListener('mouseup', (e) => {
            // 同样拦截抬起时的默认行为，彻底封死侧键
            if (e.button === 3 || e.button === 4) {
                e.preventDefault();
                e.stopPropagation();
            }

            document.querySelectorAll('.m-key, .m-wheel, .s-key').forEach(el => {
                el.classList.remove('active-press');
            });
        }, true); // 使用捕获模式

        window.addEventListener('wheel', (e) => {
            const wheel = document.getElementById('m-wheel');
            wheel.classList.add('passed-green');
            energyBar.classList.add('scrolling-red');
            
            if (e.deltaY < 0) {
                energyLevel = Math.min(100, energyLevel + 10);
                showPopText("向上滚动 ↑");
            } else {
                energyLevel = Math.max(0, energyLevel - 10);
                showPopText("向下滚动 ↓");
            }
            
            energyBar.style.height = energyLevel + '%';

            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                energyBar.classList.remove('scrolling-red');
            }, 100);
        });
    </script>
</body>
</html>
